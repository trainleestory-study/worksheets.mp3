<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phonics Reader Audio Companion</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      max-width: 450px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 { color: #ff6b6b; font-size: 22px; margin-bottom: 15px; }
    
    .select-group { text-align: left; margin-bottom: 15px; }
    label { font-weight: bold; font-size: 14px; color: #333; display: block; margin-bottom: 5px; }
    select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #4ecdc4;
      background-color: #f9f9f9;
      cursor: pointer;
    }

    .section-title {
      font-weight: bold;
      color: #555;
      margin: 15px 0 5px 0;
      text-align: left;
      font-size: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      font-size: 15px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-sizing: border-box;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }

    .btn-readall { background-color: #6c5ce7; }
    .btn-read1 { background-color: #4ecdc4; }
    .btn-read2 { background-color: #45b7aa; }
    .btn-read3 { background-color: #3b9c90; }

    .btn-q1 { background-color: #f7d794; color: #333; }
    .btn-q2 { background-color: #ff7675; }
    .btn-q3 { background-color: #74b9ff; }
    
    .btn-stop { background-color: #d63031; margin-top: 15px; }
    .status { margin-top: 15px; font-weight: bold; color: #555; font-size: 14px; }
  </style>
</head>
<body>

<div class="card">
  <h1>🌟 👦🏻 Train Lee Reading Practice 🌟</h1>
  
  <div class="select-group">
    <label for="lessonSelect">📌 Select Page Number:</label>
    <select id="lessonSelect" onchange="loadSelectedLesson()">
      <option value="">Loading pages...</option>
    </select>
  </div>

  <div class="section-title">📖 Read Passage Options:</div>
  <!-- New Button for Whole Passage -->
  <button class="btn btn-readall" onclick="playFullPassage()">📖 Read Full Passage</button>
  
  <!-- Individual Sentence Buttons -->
  <button class="btn btn-read1" onclick="playSentence(1)">🚂 Sentence 1</button>
  <button class="btn btn-read2" onclick="playSentence(2)">🚃 Sentence 2</button>
  <button class="btn btn-read3" onclick="playSentence(3)">🚅 Sentence 3</button>

  <div class="section-title">❓ Comprehension Questions:</div>
  <button class="btn btn-q1" onclick="speakText(currentLesson.q1)">1️⃣ Question 1</button>
  <button class="btn btn-q2" onclick="speakText(currentLesson.q2)">2️⃣ Question 2</button>
  <button class="btn btn-q3" onclick="speakText(currentLesson.q3)">3️⃣ Question 3</button>

  <button class="btn btn-stop" onclick="stopAudio()">⏹️ Stop Audio</button>

  <div class="status" id="statusText">Loading database...</div>
</div>

<script>
  let currentLesson = {};
  const synth = window.speechSynthesis;
  let selectedVoice = null;

  function initApp() {
    const db = window.database || (typeof database !== 'undefined' ? database : null);
    const select = document.getElementById('lessonSelect');

    if (!db || Object.keys(db).length === 0) {
      updateStatus("⚠️ Could not load scripts.js content");
      return;
    }

    select.innerHTML = '';
    for (let key in db) {
      let opt = document.createElement('option');
      opt.value = key;
      opt.innerHTML = `Page ${key} - ${db[key].passage.substring(0, 20)}...`;
      select.appendChild(opt);
    }
    loadSelectedLesson();
  }

  function loadSelectedLesson() {
    const db = window.database || (typeof database !== 'undefined' ? database : null);
    const select = document.getElementById('lessonSelect');
    if (!select.value || !db) return;
    const key = select.value;
    currentLesson = db[key];
    updateStatus(`Loaded Page ${key}`);
  }

  function loadVoice() {
    const voices = synth.getVoices();
    selectedVoice = voices.find(v => v.lang.includes('en-GB') && (v.name.includes('Google') || v.name.includes('Female') || v.name.includes('Victoria') || v.name.includes('Fiona'))) ||
                    voices.find(v => v.lang.includes('en-US') && (v.name.includes('Samantha') || v.name.includes('Zira') || v.name.includes('Female'))) ||
                    voices.find(v => v.lang.includes('en-GB')) ||
                    voices.find(v => v.lang.includes('en-US')) ||
                    voices[0];
  }

  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoice;
  }

  function updateStatus(text) {
    document.getElementById('statusText').innerText = text;
  }

  function speakText(text, callback) {
    synth.cancel();
    if (!text) {
      updateStatus("⚠️ No text available");
      return;
    }
    const utterance = new SpeechSynthesisUtterance(text);
    if (selectedVoice) utterance.voice = selectedVoice;
    
    // Set speech speed to 0.7x (30% slower for clear phonics listening)
    utterance.rate = 0.7;   
    utterance.pitch = 1.25; 

    utterance.onstart = () => updateStatus("🔊 Reading...");
    utterance.onend = () => {
      updateStatus("Done reading!");
      if (callback) callback();
    };

    synth.speak(utterance);
  }

  function playFullPassage() {
    if (!currentLesson.passage) return;
    updateStatus("📖 Reading full passage...");
    speakText(currentLesson.passage);
  }

  function playSentence(sentenceNum) {
    if (!currentLesson.passage) return;

    // Split passage into sentences ending with . ! or ?
    const sentences = currentLesson.passage.match(/[^.!?]+[.!?]+/g) || [currentLesson.passage];
    const targetIndex = sentenceNum - 1;

    if (sentences[targetIndex]) {
      const sentenceText = sentences[targetIndex].trim();
      updateStatus(`📖 Reading Sentence ${sentenceNum}...`);
      speakText(sentenceText);
    } else {
      updateStatus(`⚠️ Sentence ${sentenceNum} not found`);
    }
  }

  function stopAudio() {
    synth.cancel();
    updateStatus("Audio stopped.");
  }
</script>

<script>
  const scriptTag = document.createElement('script');
  scriptTag.src = 'scripts.js?v=' + new Date().getTime();
  scriptTag.onload = () => {
    loadVoice();
    initApp();
  };
  scriptTag.onerror = () => {
    updateStatus("⚠️ Failed to download scripts.js file from server.");
  };
  document.head.appendChild(scriptTag);
</script>

</body>
</html>
